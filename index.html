.duo {
  --card:#fff;
  --green:#58cc02;
  --green-d:#58a700;
  --green-l:#89e219;
  --blue:#1cb0f6;
  --blue-d:#1899d6;
  --red:#ff4b4b;
  --red-d:#ea2b2b;
  --orange:#ff9600;
  --orange-d:#cc7900;
  --yellow:#ffc800;
  --yellow-d:#e5b400;
  --purple:#ce82ff;
  --purple-d:#a568cc;
  --text:#4b4b4b;
  --sub:#777;
  --line:#e5e5e5;
  --snow:#f7f7f7;
  --ok-bg:#d7ffb8;
  --bad-bg:#ffdfe0;
  --sel-bg:#ddf4ff;
  --sel-line:#84d8ff;
  position: fixed;
  inset: 0;
  z-index: 9999;
  background: var(--card);
  color: var(--text);
  font-family:
    "M PLUS Rounded 1c",
    system-ui,
    sans-serif;
  font-weight: 700;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.duo * {
  box-sizing: border-box;
}
.duo button {
  font-family: inherit;
  cursor: pointer;
  color: inherit;
}
.duo h1,
.duo h2,
.duo h3,
.duo .ti {
  font-family:
    "Titan One",
    "M PLUS Rounded 1c",
    sans-serif;
  font-weight: 400;
  letter-spacing: .2px;
}
.duo .btn {
  font-family: "Titan One", sans-serif;
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: .9px;
  font-size: 15px;
  border: 0;
  border-radius: 16px;
  padding: 14px 22px;
  color: #fff;
  background: var(--green);
  box-shadow: 0 4px 0 var(--green-d);
  transition:
    transform .06s,
    box-shadow .06s,
    filter .15s;
  position: relative;
  top: 0;
}
.duo .btn:hover {
  filter: brightness(1.07);
}
.duo .btn:active,
.duo .btn.down {
  transform: translateY(4px);
  box-shadow: 0 0 0 var(--green-d);
}
.duo .btn.blue {
  background: var(--blue);
  box-shadow: 0 4px 0 var(--blue-d);
}
.duo .btn.blue:active {
  box-shadow: 0 0 0;
}
.duo .btn.red {
  background: var(--red);
  box-shadow: 0 4px 0 var(--red-d);
}
.duo .btn.red:active {
  box-shadow: 0 0 0;
}
.duo .btn.orange {
  background: var(--orange);
  box-shadow: 0 4px 0 var(--orange-d);
}
.duo .btn.white {
  background: var(--card);
  color: var(--blue);
  border: 2px solid var(--line);
  box-shadow: 0 4px 0 var(--line);
  padding: 12px 20px;
}
.duo .btn.white.g {
  color: var(--green);
}
.duo .btn.white:active {
  box-shadow: 0 0 0 var(--line);
}
.duo .btn.dis {
  background: var(--line);
  color: #afafaf;
  box-shadow: none;
  cursor: default;
  pointer-events: none;
}
.duo .btn.wide {
  width: 100%;
}
.duo .app {
  display: flex;
  height: 100%;
}
.duo .side {
  width: 256px;
  flex: none;
  border-right: 2px solid var(--line);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: auto;
}
.duo .logo {
  font-family: "Titan One";
  font-size: 34px;
  color: var(--green);
  padding: 8px 12px 18px;
  letter-spacing: .5px;
  text-shadow: 0 3px 0 #46a302;
}
.duo .nav {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 11px 14px;
  border-radius: 14px;
  border: 2px solid transparent;
  font-family: "Titan One";
  font-size: 15px;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: #777;
  background: none;
  text-align: left;
}
.duo .nav:hover {
  background: var(--snow);
}
.duo .nav.on {
  background: var(--sel-bg);
  border-color: var(--sel-line);
  color: var(--blue);
}
.duo .nav svg {
  width: 30px;
  height: 30px;
  flex: none;
}
.duo .main {
  flex: 1;
  min-width: 0;
  overflow: auto;
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 0 24px 40px;
  scroll-behavior: smooth;
}
.duo .col {
  width: 100%;
  max-width: 640px;
  padding-top: 24px;
}
.duo .rail {
  width: 340px;
  flex: none;
  padding-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.duo .stats {
  display: flex;
  justify-content: flex-end;
  gap: 18px;
  font-family: "Titan One";
  font-size: 17px;
}
.duo .stat {
  display: flex;
  align-items: center;
  gap: 7px;
}
.duo .stat svg {
  width: 26px;
  height: 26px;
}
.duo .card {
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 18px;
  background: var(--card);
}
.duo .card h3 {
  font-size: 20px;
  margin: 0 0 10px;
  color: var(--text);
}
.duo .banner {
  background: var(--green);
  border-radius: 18px;
  color: #fff;
  padding: 18px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 5px 0 var(--green-d);
  margin-bottom: 14px;
  position: sticky;
  top: 6px;
  z-index: 5;
}
.duo .banner small {
  font-family: "M PLUS Rounded 1c";
  font-weight: 800;
  letter-spacing: .6px;
  opacity: .85;
  text-transform: uppercase;
  font-size: 13px;
  display: block;
}
.duo .banner h2 {
  margin: 2px 0 0;
  font-size: 22px;
}
.duo .path {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  padding: 70px 0 60px;
}
.duo .node {
  position: relative;
  width: 88px;
  height: 80px;
  border-radius: 50%;
  border: 0;
  display: grid;
  place-items: center;
  background: var(--green);
  box-shadow: 0 8px 0 var(--green-d);
  transition: transform .08s, box-shadow .08s;
}
.duo .node:active {
  transform: translateY(6px);
  box-shadow: 0 2px 0 var(--green-d);
}
.duo .node svg {
  width: 40px;
  height: 40px;
}
.duo .node.done {
  background: var(--yellow);
  box-shadow: 0 8px 0 var(--yellow-d);
}
.duo .node.done:active {
  box-shadow: 0 2px 0 var(--yellow-d);
}
.duo .node .lab {
  position: absolute;
  bottom: -34px;
  font-size: 13px;
  color: var(--sub);
  font-weight: 800;
  white-space: nowrap;
}
.duo .node .ring {
  position: absolute;
  inset: -9px;
  border-radius: 50%;
}
.duo .start {
  position: absolute;
  top: -52px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--card);
  border: 2px solid var(--line);
  color: var(--green);
  border-radius: 14px;
  padding: 7px 14px;
  font-family: "Titan One";
  font-size: 14px;
  letter-spacing: .8px;
  animation: bob 1.4s ease-in-out infinite;
  white-space: nowrap;
}
.duo .start:after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -8px;
  width: 12px;
  height: 12px;
  background: var(--card);
  border-right: 2px solid var(--line);
  border-bottom: 2px solid var(--line);
  transform: translateX(-50%) rotate(45deg);
}
@keyframes bob {
  50% {
    transform: translateX(-50%) translateY(-6px);
  }
}
.duo .pop {
  position: absolute;
  z-index: 40;
  left: 50%;
  transform: translateX(-50%);
  top: 124px;
  width: 310px;
  background: var(--green);
  color: #fff;
  border-radius: 18px;
  padding: 16px;
  text-align: left;
  animation: popin .18s ease-out;
}
.duo .pop:before {
  content: "";
  position: absolute;
  top: -9px;
  left: 50%;
  width: 18px;
  height: 18px;
  background: var(--green);
  transform: translateX(-50%) rotate(45deg);
  border-radius: 3px;
}
.duo .pop h3 {
  margin: 0;
  font-size: 22px;
}
.duo .pop p {
  margin: 4px 0 12px;
  font-weight: 700;
  opacity: .95;
  font-size: 15px;
}
.duo .pop .row {
  display: flex;
  gap: 10px;
}
.duo .pop .btn {
  flex: 1;
  padding: 12px 8px;
}
.duo .pop .btn.white {
  border: 0;
  box-shadow: 0 4px 0 #d0d0d0;
  color: var(--green);
}
@keyframes popin {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(-8px) scale(.96);
  }
}
.duo .seg {
  display: inline-flex;
  background: var(--snow);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 4px;

      el.innerHTML = `<div class="ex"><div class="ex-top"><button class="x" data-cx="1">${I.x}</button><div class="bar"><i style="width:${fc.i / fc.l.length * 100}%"></i></div><span class="chip">${fc.i + 1}/${fc.l.length}</span></div>
    <div class="ex-body" style="--fs:${n < 300 ? 21 : n < 600 ? 18 : 15.5}px"><div class="stage"><h1 class="head">Flashcard <span style="font-size:.6em;color:var(--sub)">W${q.w} Q${q.n}</span></h1>
    <div class="fc ${fc.flip ? "flip" : ""}" data-flip="1"><div class="in"><div class="face"><div>${esc(q.q).replace(/\n/g, "<br>")}</div>${q.img ? `<img class="qimg" style="max-height:22vh" src="${IMGS[q.img]}" alt="">` : ""}${q.opts.map((o, i) => `<div style="color:var(--sub)">${L[i]}) ${esc(o)}</div>`).join("")}<div class="kb" style="margin-top:6px">Tap or press Space to flip</div></div>

      if (a === "week") return startSes(weekQs(+b).slice(), c, "Week " + b, "week:" + b);
      const nm = MODES.find((m) => m[0] === a);

      const t = e.target.closest("button,[data-flip]");
      if (!t) {

        return;
      }
      const d = t.dataset;
      if (d.rvx) {
        const b = t.parentElement.querySelector(".rv2b");
        b.hidden = !b.hidden;
        t.classList.toggle("open", !b.hidden);

        return render();

      if (d.next != null) {

        return next();

        return render();

      if (d.rv) {

        snd.tap();
        return render();
      }
      if (d.rvw != null) {
        rvf.w = +d.rvw;
        return render();

        return render();
      }
      if (d.cards) return startCards(d.cards);
      if (d.cx != null) return goHome();
      if (d.flip != null) {
        fc.flip = !fc.flip;

        return $(".fc", el).classList.toggle("flip");
      }
      if (d.again != null) {
        if (!fc.flip) return;
        fc.l.push(fc.l[fc.i]);
        fc.i++;
        fc.flip = false;
        snd.no();
        return renderCards();
      }
      if (d.got != null) {
        if (!fc.flip) return;
        fc.i++;
        fc.flip = false;
        snd.ok();
        return renderCards();
      }
      if (d.av != null) {
        S.set.av = +d.av;
        save();
        snd.tap();
        return render();
      }
      if (d.tg) {
        if (d.tg === "theme") S.set.theme = S.set.theme === "light" ? "dark" : "light";
        else S.set[d.tg] = !S.set[d.tg];
        save();
        if (d.tg === "sound" && S.set.sound) snd.tap();
        return render();
      }
      if (d.ts) {
        S.set.textSize = d.ts;
        save();
        snd.tap();
        applyTs();
        return render();
      }
      if (d.reset != null) {
        if (confirm("Reset all progress on this device?")) {
          S = { q: {}, xp: 0, days: [], best: {}, set: S.set };
          save();
          render();
        }
      }
    });
    el.addEventListener("input", (e) => {
      if (e.target.id === "rvq") {
        rvf.q = e.target.value;

        render();

        n.focus();
        n.setSelectionRange(pos, pos);
      }
      if (e.target.id === "nm") {
        S.set.name = e.target.value;
        save();
      }
    });
    const onKey = (e) => {
      if (!el.isConnected) return document.removeEventListener("keydown", onKey);
      if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
      const k = e.key;
      if ($(".modal", el)) {
        if (k === "Escape") $(".modal", el).remove();
        if (k === "Enter") goHome();
        return;
      }
      if (fc) {
        if (k === " " || k === "Enter" || k === "ArrowUp" || k === "ArrowDown") {
          e.preventDefault();
          fc.flip = !fc.flip;
          renderCardsFlip();
        } else if (k === "ArrowRight" && fc.flip) {
          fc.i++;
          fc.flip = false;
          snd.ok();
          renderCards();
        } else if (k === "ArrowLeft" && fc.flip) {
          fc.l.push(fc.l[fc.i]);
          fc.i++;
          fc.flip = false;
          snd.no();
          renderCards();
        } else if (k === "Escape") goHome();
        return;
      }
      if (!ses || !ses.cur) return;
      if (k === "Escape") return exit();
      if (!$(".ex", el)) return;
      const it = ses.cur;
      if (ses.state === "ask") {
        const n = it.order.length;
        let p = -1;
        if (/^[1-6]$/.test(k)) p = +k - 1;
        else if (/^[a-fA-F]$/.test(k)) p = L.indexOf(k.toUpperCase());
        if (p >= 0 && p < n) {
          e.preventDefault();
          ses.foc = p;
          ses.kbd = true;
          return pickOpt(it.order[p]);
        }
        if (k === "ArrowDown" || k === "ArrowRight") {
          e.preventDefault();
          ses.kbd = true;
          ses.foc = (ses.foc + 1) % n;
          return refresh();
        }
        if (k === "ArrowUp" || k === "ArrowLeft") {
          e.preventDefault();
          ses.kbd = true;
          ses.foc = (ses.foc - 1 + n) % n;
          return refresh();
        }
        if (k === " ") {
          e.preventDefault();
          ses.kbd = true;
          return pickOpt(it.order[ses.foc]);
        }
        if (k === "Enter") {
          e.preventDefault();
          return check();
        }
      } else if (k === "Enter" || k === " ") {
        e.preventDefault();
        snd.tap();
        next();
      }
    };
    function renderCardsFlip() {
      const f = $(".fc", el);
      if (f) {
        f.classList.toggle("flip", fc.flip);
        snd.tap();
        const a = $("[data-again]", el), g = $("[data-got]", el);
        if (a) a.style.opacity = fc.flip ? 1 : 0.4;
        if (g) g.style.opacity = fc.flip ? 1 : 0.4;
      }
    }
    document.addEventListener("keydown", onKey);
    render();
    return () => document.removeEventListener("keydown", onKey);
  }
